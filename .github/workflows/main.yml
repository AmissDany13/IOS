name: Compilar HelloWorldD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Verificar Xcode
        run: xcodebuild -version

      - name: Revisar proyecto
        run: |
          find . -name "*.xcodeproj"
          xcodebuild -list -project HelloWorldD.xcodeproj

      - name: Compilar aplicacion iOS
        run: |
          xcodebuild \
            -project HelloWorldD.xcodeproj \
            -scheme HelloWorldD \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
