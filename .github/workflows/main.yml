name: Compilar HelloWorldD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'HelloWorldD/**'
      - '.github/workflows/main.yml'

permissions:
  contents: read

concurrency:
  group: helloworldd-appetize
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Verificar Xcode
        run: xcodebuild -version

      - name: Revisar proyecto
        run: |
          find . -name "*.xcodeproj"
          xcodebuild -list -project HelloWorldD/HelloWorldD.xcodeproj

      - name: Compilar aplicacion iOS
        run: |
          xcodebuild \
            -project HelloWorldD/HelloWorldD.xcodeproj \
            -scheme HelloWorldD \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Comprimir aplicacion
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          ditto -c -k --keepParent HelloWorldD.app HelloWorldD.zip

      - name: Exportar aplicacion
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorldD-iOS
          path: build/Build/Products/Debug-iphonesimulator/HelloWorldD.zip
          if-no-files-found: error
          retention-days: 7

      - name: Verificar credenciales
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ] || [ -z "$APPETIZE_PUBLIC_KEY" ]; then
            echo "Faltan los secretos de Appetize"
            exit 1
          fi

      - name: Actualizar Appetize
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          publicKey: ${{ secrets.APPETIZE_PUBLIC_KEY }}
          appFile: build/Build/Products/Debug-iphonesimulator/HelloWorldD.zip
          platform: ios
          fileType: zip
