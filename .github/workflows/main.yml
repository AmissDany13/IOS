name: Compilar HelloWorldD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'HelloWorldD/**'
      - '.github/workflows/main.yml'

permissions:
  contents: read

concurrency:
  group: helloworldd-appetize
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Verificar Xcode
        run: xcodebuild -version

      - name: Revisar proyecto
        run: |
          xcodebuild -list -project HelloWorldD/HelloWorldD.xcodeproj

      - name: Compilar aplicacion iOS
        run: |
          xcodebuild \
            -project HelloWorldD/HelloWorldD.xcodeproj \
            -scheme HelloWorldD \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Comprimir aplicacion
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          ditto -c -k --keepParent HelloWorldD.app HelloWorldD.zip

      - name: Exportar aplicacion
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorldD-iOS
          path: build/Build/Products/Debug-iphonesimulator/HelloWorldD.zip
          retention-days: 7

      - name: Actualizar Appetize API v2
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST "https://api.appetize.io/v2/builds" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "platform=ios" \
            -F "file=@build/Build/Products/Debug-iphonesimulator/HelloWorldD.zip"
